<div class="flex items-center justify-between px-8 pt-8 pb-6 border-b border-gray-100 shrink-0">
    <div>
        <span class="text-[9px] font-black uppercase bg-ageis-black text-ageis-yellow px-2 py-0.5 rounded">{{ tipo|upper }}</span>
        <h2 class="text-xl font-black text-gray-900 uppercase italic tracking-tight mt-2">Selecionar Parceiro</h2>
        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide">{{ escola.nome|default:escola.inep }}</p>
    </div>
    <button type="button" onclick="window.fecharParceiroModal()" class="p-2 text-gray-400 hover:text-black hover:bg-gray-100 rounded-xl transition-all">
        <i data-lucide="x" class="w-5 h-5"></i>
    </button>
</div>

{% if erro %}
<div class="p-8">
    <p class="text-[11px] font-black text-red-600 uppercase">{{ erro }}</p>
</div>
{% else %}
<div class="px-8 py-6 border-b border-gray-100 bg-gray-50/30 shrink-0">
    <form onsubmit="return window.buscarParceiroModal(this, '{{ tipo }}', {{ escola.pk }});" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <input type="text" name="q" value="{{ q }}" placeholder="Nome, razão social ou CNPJ" class="sm:col-span-4 px-4 py-2.5 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-ageis-yellow text-xs font-bold">
        <input type="text" name="cidade" value="{{ cidade }}" placeholder="Cidade" class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-ageis-yellow text-xs font-bold">
        <input type="text" name="bairro" value="{{ bairro }}" placeholder="Bairro" class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-ageis-yellow text-xs font-bold">
        <input type="text" name="estado" value="{{ estado }}" placeholder="UF" maxlength="2" class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-ageis-yellow text-xs font-bold uppercase">
        <button type="submit" class="px-4 py-2.5 bg-ageis-black text-ageis-yellow rounded-xl text-[10px] font-black uppercase italic hover:bg-gray-800 transition">Buscar</button>
    </form>
</div>

<div class="p-8 space-y-3 overflow-y-auto">
    {% for parceiro in parceiros %}
    <button type="button"
            onclick="window.selecionarParceiroRede('{{ tipo }}', {{ escola.pk }}, {{ parceiro.pk }}, '{{ parceiro|escapejs }}')"
            class="w-full text-left flex items-center justify-between gap-3 p-4 bg-gray-50 hover:bg-ageis-yellow/20 border border-gray-100 hover:border-ageis-yellow rounded-2xl transition">
        <div class="min-w-0">
            <p class="text-[12px] font-black text-gray-900 truncate">{{ parceiro }}</p>
            <p class="text-[10px] font-bold text-gray-400 uppercase truncate">{{ parceiro.cnpj_cpf|default:"CNPJ não informado" }}</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 shrink-0"></i>
    </button>
    {% empty %}
    <div class="text-center py-10 opacity-40">
        <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2"></i>
        <p class="text-xs font-black uppercase tracking-widest italic">Nenhum parceiro encontrado</p>
    </div>
    {% endfor %}
</div>
{% endif %}
