<div class="bg-white p-8 rounded-[2rem] shadow-xl border border-gray-100 flex flex-col relative overflow-hidden transition-all hover:shadow-2xl">

    <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 bg-gray-900 rounded-2xl flex items-center justify-center shadow-md">
            <i data-lucide="headphones" class="w-6 h-6 text-ageis-yellow"></i>
        </div>
        <div>
            <h2 class="text-lg font-black text-gray-900 uppercase italic tracking-tight">Atendimento IXC</h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Abertura de OS em Massa</p>
        </div>
    </div>

    <div class="border-2 border-dashed border-gray-200 rounded-2xl p-4 text-center mb-6 bg-gray-50/50">
        <form method="POST" action="{% url 'backoffice:download_modelo_atendimento' %}">
            {% csrf_token %}
            <button type="submit" class="inline-flex items-center gap-2 text-[10px] font-black text-gray-900 hover:text-ageis-yellow transition-colors uppercase tracking-widest bg-transparent border-none cursor-pointer p-0">
                <i data-lucide="download" class="w-3 h-3"></i> Baixar Planilha Modelo
            </button>
        </form>
        <p class="mt-3 text-[10px] font-bold uppercase tracking-widest text-gray-400">
            Campos com <span class="text-gray-700">_ID</span> aceitam apenas numero do IXC.
        </p>
    </div>

    <form method="POST" action="{% url 'backoffice:atendimento_import' %}" enctype="multipart/form-data" class="space-y-6 flex-1 flex flex-col justify-end" id="formImportacaoOS">
        {% csrf_token %}

        <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Arquivo de OS</label>

            <input type="file" name="arquivo_atendimento" id="arquivo_atendimento" accept=".xlsx, .xls, .csv" required class="hidden">

            <label for="arquivo_atendimento" class="flex items-center w-full bg-gray-50 border border-gray-100 rounded-xl cursor-pointer hover:bg-gray-100 transition-all overflow-hidden group">
                <div class="bg-gray-900 text-ageis-yellow group-hover:text-white text-[10px] font-black uppercase tracking-wider py-3 px-4 shadow-sm transition-all flex items-center gap-2">
                    <i data-lucide="upload-cloud" class="w-3 h-3"></i> Planilha
                </div>
                <span id="nome_arquivo_atendimento" class="text-xs font-medium text-gray-500 px-4 truncate flex-1">Nenhum arquivo...</span>
            </label>
        </div>

        <div id="areaLoadingOS" class="hidden flex flex-col items-center justify-center gap-3 mt-4 py-2">
            <div class="w-6 h-6 border-4 border-gray-100 border-t-ageis-yellow rounded-full animate-spin"></div>
            <span class="text-[10px] font-black uppercase tracking-widest text-gray-500">Abrindo OS...</span>
        </div>

        <div id="areaSucessoOS" class="hidden flex items-center justify-center gap-2 mt-4 bg-green-50 border border-green-100 py-3 px-4 rounded-xl">
            <i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>
            <span class="text-[10px] font-black uppercase tracking-widest text-green-700">Relatório Baixado!</span>
        </div>

        <button type="submit" id="btnSubmitOS" class="w-full bg-ageis-black hover:bg-gray-900 text-ageis-yellow font-black uppercase italic tracking-widest py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 group mt-auto">
            <i data-lucide="play" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
            Gerar Atendimentos
        </button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const arquivoInputOS = document.getElementById('arquivo_atendimento');
        if (arquivoInputOS) {
            arquivoInputOS.addEventListener('change', function (e) {
                const fileName = e.target.files[0] ? e.target.files[0].name : 'Nenhum arquivo...';
                document.getElementById('nome_arquivo_atendimento').textContent = fileName;
            });
        }

        const formOS = document.getElementById('formImportacaoOS');
        const btnSubmitOS = document.getElementById('btnSubmitOS');
        const areaLoadingOS = document.getElementById('areaLoadingOS');
        const areaSucessoOS = document.getElementById('areaSucessoOS');

        if (formOS && arquivoInputOS && btnSubmitOS) {
            formOS.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (arquivoInputOS.files.length === 0) return;

                btnSubmitOS.classList.add('hidden');
                areaSucessoOS.classList.add('hidden');
                areaLoadingOS.classList.remove('hidden');

                try {
                    const formData = new FormData(formOS);
                    const response = await fetch(formOS.action, {
                        method: 'POST',
                        body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'Relatorio_Importacao_OS_IXC.xlsx';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);

                        areaLoadingOS.classList.add('hidden');
                        areaSucessoOS.classList.remove('hidden');
                        formOS.reset();
                        document.getElementById('nome_arquivo_atendimento').textContent = 'Nenhum arquivo...';

                        setTimeout(() => {
                            areaSucessoOS.classList.add('hidden');
                            btnSubmitOS.classList.remove('hidden');
                        }, 5000);
                    } else {
                        alert("Erro ao processar OS. Verifique a planilha.");
                        window.location.reload();
                    }
                } catch (error) {
                    alert("Falha na conexão.");
                    window.location.reload();
                }
            });
        }
    });
</script>
