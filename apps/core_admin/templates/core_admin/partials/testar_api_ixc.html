<div class="bg-white p-8 rounded-[2rem] shadow-xl border border-gray-100 flex flex-col relative overflow-hidden transition-all hover:shadow-2xl">
    <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 bg-gray-900 rounded-2xl flex items-center justify-center shadow-md">
            <i data-lucide="activity" class="w-6 h-6 text-ageis-yellow"></i>
        </div>
        <div>
            <h2 class="text-lg font-black text-gray-900 uppercase italic tracking-tight">Teste de Conexao IXC</h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Valida se a API esta respondendo</p>
        </div>
    </div>

    <div class="border-2 border-dashed border-gray-200 rounded-2xl p-4 text-center mb-6 bg-gray-50/50">
        <p id="ixcTestInfo" class="text-[10px] font-bold uppercase tracking-widest text-gray-400">
            Clique no botao para verificar o status da API do IXC.
        </p>
    </div>

    <div id="ixcTestLoading" class="hidden flex flex-col items-center justify-center gap-3 py-2 mb-4">
        <div class="w-6 h-6 border-4 border-gray-100 border-t-ageis-yellow rounded-full animate-spin"></div>
        <span class="text-[10px] font-black uppercase tracking-widest text-gray-500">Testando conexao...</span>
    </div>

    <div id="ixcTestSuccess" class="hidden flex items-center justify-center gap-2 bg-green-50 border border-green-100 py-3 px-4 rounded-xl mb-4">
        <i data-lucide="check-circle" class="w-5 h-5 text-green-500 flex-shrink-0"></i>
        <span id="ixcTestSuccessMsg" class="text-[10px] font-black uppercase tracking-widest text-green-700">API respondendo normalmente!</span>
    </div>

    <div id="ixcTestError" class="hidden bg-red-50 border border-red-100 py-3 px-4 rounded-xl mb-4">
        <div class="flex items-center gap-2 mb-2">
            <i data-lucide="x-circle" class="w-5 h-5 text-red-500 flex-shrink-0"></i>
            <span class="text-[10px] font-black uppercase tracking-widest text-red-700">Falha na conexao</span>
        </div>
        <pre id="ixcTestErrorMsg" class="text-[10px] text-red-600 font-mono whitespace-pre-wrap break-all leading-relaxed"></pre>
    </div>

    {% csrf_token %}
    <button id="ixcTestBtn" type="button" class="w-full bg-ageis-black hover:bg-gray-900 text-ageis-yellow font-black uppercase italic tracking-widest py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 group mt-auto">
        <i data-lucide="zap" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
        Testar API IXC
    </button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const ixcTestBtn = document.getElementById('ixcTestBtn');
        const ixcTestLoading = document.getElementById('ixcTestLoading');
        const ixcTestSuccess = document.getElementById('ixcTestSuccess');
        const ixcTestSuccessMsg = document.getElementById('ixcTestSuccessMsg');
        const ixcTestError = document.getElementById('ixcTestError');
        const ixcTestErrorMsg = document.getElementById('ixcTestErrorMsg');
        const ixcTestInfo = document.getElementById('ixcTestInfo');
        if (ixcTestBtn) {
            ixcTestBtn.addEventListener('click', async function () {
                ixcTestBtn.disabled = true;
                ixcTestSuccess.classList.add('hidden');
                ixcTestError.classList.add('hidden');
                ixcTestLoading.classList.remove('hidden');

                try {
                    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
                    const response = await fetch("{% url 'testar_api_ixc' %}", {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': csrfToken ? csrfToken.value : '',
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                    });

                    const contentType = response.headers.get('content-type') || '';
                    if (!contentType.includes('application/json')) {
                        throw new Error(
                            response.status === 401 ? 'Sessao expirada. Recarregue a pagina (F5).' :
                            response.status === 403 ? 'CSRF invalido ou sessao expirada. Recarregue a pagina (F5).' :
                            'Resposta inesperada do servidor (HTTP ' + response.status + '). Recarregue a pagina.'
                        );
                    }
                    const data = await response.json();
                    ixcTestLoading.classList.add('hidden');

                    if (data.ok) {
                        const urlInfo = data.url ? ' (' + data.url + ')' : '';
                        ixcTestSuccessMsg.textContent = 'API respondendo normalmente! HTTP ' + (data.status_code || 200) + urlInfo;
                        ixcTestSuccess.classList.remove('hidden');
                        ixcTestInfo.textContent = 'Ultimo teste: OK';
                    } else {
                        const statusInfo = data.status_code ? 'HTTP ' + data.status_code + ' — ' : '';
                        ixcTestErrorMsg.textContent = statusInfo + (data.erro || 'Erro desconhecido.');
                        ixcTestError.classList.remove('hidden');
                        ixcTestInfo.textContent = 'Ultimo teste: FALHOU';
                        if (window.lucide) window.lucide.createIcons();
                    }
                } catch (err) {
                    ixcTestLoading.classList.add('hidden');
                    ixcTestErrorMsg.textContent = 'Erro de rede: ' + err.message;
                    ixcTestError.classList.remove('hidden');
                    ixcTestInfo.textContent = 'Ultimo teste: FALHOU';
                    if (window.lucide) window.lucide.createIcons();
                } finally {
                    ixcTestBtn.disabled = false;
                }
            });
        }
    });
</script>
