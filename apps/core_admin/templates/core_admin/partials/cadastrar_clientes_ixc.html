<div class="bg-white p-8 rounded-[2rem] shadow-xl border border-gray-100 flex flex-col relative overflow-hidden transition-all hover:shadow-2xl">

    <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 bg-gray-900 rounded-2xl flex items-center justify-center shadow-md">
            <i data-lucide="user-round-plus" class="w-6 h-6 text-ageis-yellow"></i>
        </div>
        <div>
            <h2 class="text-lg font-black text-gray-900 uppercase italic tracking-tight">Clientes IXC</h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Cadastro de Cliente</p>
        </div>
    </div>

    <div class="border-2 border-dashed border-gray-200 rounded-2xl p-4 text-center mb-6 bg-gray-50/50">
        <form method="POST" action="{% url 'backoffice:download_template_cadastro_cliente_ixc' %}">
            {% csrf_token %}
            <button type="submit" class="inline-flex items-center gap-2 text-[10px] font-black text-gray-900 hover:text-ageis-yellow transition-colors uppercase tracking-widest bg-transparent border-none cursor-pointer p-0">
                <i data-lucide="download" class="w-3 h-3"></i> Baixar Planilha Modelo
            </button>
        </form>
        <p class="mt-3 text-[10px] font-bold uppercase tracking-widest text-gray-400">
            Razao_Social, CNPJ_CPF e confirmacao obrigatorios.
        </p>
    </div>

    <form method="POST" action="{% url 'backoffice:cadastrar_clientes_ixc' %}" enctype="multipart/form-data" class="space-y-6 flex-1 flex flex-col justify-end" id="formCadastroClienteIXC">
        {% csrf_token %}

        <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Arquivo de Clientes</label>

            <input type="file" name="arquivo_cadastro_cliente_ixc" id="arquivo_cadastro_cliente_ixc" accept=".xlsx, .xls, .csv" required class="hidden">

            <label for="arquivo_cadastro_cliente_ixc" class="flex items-center w-full bg-gray-50 border border-gray-100 rounded-xl cursor-pointer hover:bg-gray-100 transition-all overflow-hidden group">
                <div class="bg-gray-900 text-ageis-yellow group-hover:text-white text-[10px] font-black uppercase tracking-wider py-3 px-4 shadow-sm transition-all flex items-center gap-2">
                    <i data-lucide="upload-cloud" class="w-3 h-3"></i> Planilha
                </div>
                <span id="nome_arquivo_cadastro_cliente" class="text-xs font-medium text-gray-500 px-4 truncate flex-1">Nenhum arquivo...</span>
            </label>
        </div>

        <div id="areaLoadingCadastroCliente" class="hidden flex flex-col items-center justify-center gap-3 mt-4 py-2">
            <div class="w-6 h-6 border-4 border-gray-100 border-t-ageis-yellow rounded-full animate-spin"></div>
            <span class="text-[10px] font-black uppercase tracking-widest text-gray-500">Cadastrando Clientes...</span>
        </div>

        <div id="areaSucessoCadastroCliente" class="hidden flex items-center justify-center gap-2 mt-4 bg-green-50 border border-green-100 py-3 px-4 rounded-xl">
            <i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>
            <span class="text-[10px] font-black uppercase tracking-widest text-green-700">Relatorio Baixado!</span>
        </div>

        <button type="submit" id="btnSubmitCadastroCliente" class="w-full bg-ageis-black hover:bg-gray-900 text-ageis-yellow font-black uppercase italic tracking-widest py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 group mt-auto">
            <i data-lucide="play" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
            Cadastrar Clientes
        </button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const arquivoInputCadastroCliente = document.getElementById('arquivo_cadastro_cliente_ixc');
        if (arquivoInputCadastroCliente) {
            arquivoInputCadastroCliente.addEventListener('change', function (e) {
                const fileName = e.target.files[0] ? e.target.files[0].name : 'Nenhum arquivo...';
                document.getElementById('nome_arquivo_cadastro_cliente').textContent = fileName;
            });
        }

        const formCadastroCliente = document.getElementById('formCadastroClienteIXC');
        const btnSubmitCadastroCliente = document.getElementById('btnSubmitCadastroCliente');
        const areaLoadingCadastroCliente = document.getElementById('areaLoadingCadastroCliente');
        const areaSucessoCadastroCliente = document.getElementById('areaSucessoCadastroCliente');

        if (formCadastroCliente && arquivoInputCadastroCliente && btnSubmitCadastroCliente) {
            formCadastroCliente.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (arquivoInputCadastroCliente.files.length === 0) return;

                btnSubmitCadastroCliente.classList.add('hidden');
                areaSucessoCadastroCliente.classList.add('hidden');
                areaLoadingCadastroCliente.classList.remove('hidden');

                try {
                    const formData = new FormData(formCadastroCliente);
                    const response = await fetch(formCadastroCliente.action, {
                        method: 'POST',
                        body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'Relatorio_Cadastro_Clientes_IXC.xlsx';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);

                        areaLoadingCadastroCliente.classList.add('hidden');
                        areaSucessoCadastroCliente.classList.remove('hidden');
                        formCadastroCliente.reset();
                        document.getElementById('nome_arquivo_cadastro_cliente').textContent = 'Nenhum arquivo...';

                        setTimeout(() => {
                            areaSucessoCadastroCliente.classList.add('hidden');
                            btnSubmitCadastroCliente.classList.remove('hidden');
                        }, 5000);
                    } else {
                        alert("Ocorreu um erro no servidor. Verifique os dados da planilha.");
                        window.location.reload();
                    }
                } catch (error) {
                    alert("Falha na conexão. Tente novamente.");
                    window.location.reload();
                }
            });
        }
    });
</script>
